config_version: 1
seed: 42

objective:
  metric: precision
  weighted_metrics: true

selection:
  strategy: best
  metric: precision
  score_source: nested_evaluation
  candidates:
    - stack
    - lightgbm
    - extra_trees
    - svm_rbf
    - logistic_regression

weighting:
  scheme: equal_star
  accepted_candidate_multiplier: 5.0

cv:
  outer_folds: 5
  inner_folds: 3
  min_outer_folds: 3
  min_inner_folds: 2
  final_oof_folds: 3
  shuffle: true

bootstrap:
  n_resamples: 1000
  confidence_level: 0.95

permutation_importance:
  n_repeats: 10
  metric: average_precision

calibration:
  n_bins: 10

models:
  logistic_regression:
    n_candidates: 6
    fixed:
      solver: lbfgs
      max_iter: 5000
      class_weight: null
    grid:
      C: [0.001, 0.01, 0.1, 1, 10, 100]

  svm_rbf:
    n_candidates: 24
    fixed:
      kernel: rbf
      class_weight: null
      cache_size: 500
    calibration:
      method: sigmoid
      cv: 5
      ensemble: false
    grid:
      C: [0.01, 0.1, 1, 10, 100]
      gamma: [scale, 0.0001, 0.001, 0.01, 0.1, 1]

  extra_trees:
    n_candidates: 24
    fixed:
      n_estimators: 500
      class_weight: null
      n_jobs: 1
    grid:
      max_depth: [6, 12, null]
      min_samples_leaf: [1, 3, 5, 10]
      max_features: [sqrt, 0.5, 1.0]

  lightgbm:
    n_candidates: 24
    fixed:
      objective: binary
      subsample_freq: 1
      verbose: -1
      n_jobs: 1
      deterministic: true
      force_row_wise: true
    grid:
      n_estimators: [100, 200, 300, 400, 500]
      learning_rate: [0.02, 0.05, 0.08, 0.1]
      num_leaves: [7, 15, 23, 31]
      max_depth: [3, 5, 7]
      min_child_samples: [10, 20, 30, 40]
      subsample: [0.7, 0.85, 1.0]
      colsample_bytree: [0.7, 0.85, 1.0]
      reg_alpha: [0.0, 0.1, 1.0]
      reg_lambda: [0.0, 0.1, 1.0]

meta:
  C: 0.1
  solver: lbfgs
  max_iter: 5000
  class_weight: null
